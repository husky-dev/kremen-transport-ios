name: KremenTransport

options:
  bundleIdPrefix: dev.kremen
  createIntermediateGroups: true
  developmentLanguage: uk
  knownRegions: [uk, en]
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.46.0"

fileGroups:
  - project.yml
  - README.md
  - Makefile

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: BLVWV6S9PP
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

targets:
  KremenTransport:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kremen.transport
        PRODUCT_NAME: KremenTransport
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Supporting/Info.plist
      properties:
        CFBundleDevelopmentRegion: uk
        CFBundleDisplayName: Транспорт
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking requires all four; an upside-down iPad is a normal way to hold one.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          Щоб показати ваше місце на карті та знайти найближчі зупинки.
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework

  KremenTransportTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Sources
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kremen.transport.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KremenTransport

schemes:
  KremenTransport:
    build:
      targets:
        KremenTransport: all
        KremenTransportTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [KremenTransportTests]
    archive:
      config: Release
